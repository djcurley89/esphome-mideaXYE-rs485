platform: thermostat
name: "Climate"
id: climate_entity
sensor: t1_temp
min_cooling_off_time: 1s
min_cooling_run_time: 1s
min_heating_off_time: 1s
min_heating_run_time: 1s
min_fanning_off_time: 1s
min_fanning_run_time: 1s
min_fan_mode_switching_time: 1s
min_idle_time: 1s
on_boot_restore_from: MEMORY
visual:
  temperature_step: "${'1 °F' if use_fahrenheit == true else '1 °C'}"
default_preset: away 
preset:
  - name: home
    default_target_temperature_low: "${'66 °F' if use_fahrenheit == true else '19 °C'}"
    default_target_temperature_high: "${'75 °F' if use_fahrenheit == true else '24 °C'}"
  - name: away
    default_target_temperature_low: "${'60 °F' if use_fahrenheit == true else '16 °C'}"
    default_target_temperature_high: "${'78 °F' if use_fahrenheit == true else '26 °C'}"
  - name: sleep
    default_target_temperature_low: "${'62 °F' if use_fahrenheit == true else '17 °C'}"
    default_target_temperature_high: "${'80 °F' if use_fahrenheit == true else '27 °C'}"
heat_cool_mode:
  - lambda: |-
      if (id(first_boot)) {
        return;
      }
      float current_temp = id(follow_me).state ? id(follow_me_temp).state : id(t1_temp).state;
      float average_of_set_points = (id(climate_entity).target_temperature_low + id(climate_entity).target_temperature_high) / 2;

      if (id(op_bytes) != 0x84 && current_temp <= average_of_set_points) {
        ESP_LOGI("custom","Changing mode to heat");
        id(op_bytes) = 0x84;
        id(new_input) = true;
      }

      if (id(op_bytes) != 0x88 && current_temp > average_of_set_points) {
        ESP_LOGI("custom","Changing mode to cool");
        id(op_bytes) = 0x88;
        id(new_input) = true;
      }
      float low_temp = id(climate_entity).target_temperature_low;

      if (id(use_fahrenheit)) {
        low_temp = low_temp * (9.0/5.0) + 32.0;
      }
      if (id(op_bytes) == 0x84 && id(set_temp) != low_temp) {
        id(set_temp) = low_temp;
        id(new_input) = true;
      }

      float high_temp = id(climate_entity).target_temperature_high;

      if (id(use_fahrenheit)) {
        high_temp = high_temp * (9.0/5.0) + 32.0;
      }
      if (id(op_bytes) == 0x88 && id(set_temp) != high_temp) {
        id(set_temp) = high_temp;
        id(new_input) = true;
      }

heat_mode:
  - lambda: |-
      if (!id(first_boot) && id(op_bytes) != 0x84) {
        ESP_LOGI("custom","Changing mode to heat");
        id(op_bytes) = 0x84;
        id(new_input) = true;
      }
cool_mode:
  - lambda: |-
      if (!id(first_boot) && id(op_bytes) != 0x88) {
        ESP_LOGI("custom","Changing mode to cool");
        id(op_bytes) = 0x88;
        id(new_input) = true;
      }
fan_only_mode:
  - lambda: |-
      if (!id(first_boot) && id(op_bytes) != 0x81) {
        ESP_LOGI("custom","Changing mode to fan only");
        id(op_bytes) = 0x81;
        id(new_input) = true;
      }
dry_mode:
  lambda: |-
      if (!id(first_boot) && id(op_bytes) != 0x82) {
        ESP_LOGI("custom","Changing mode to dry");
        id(op_bytes) = 0x82;
        id(new_input) = true;
      }
on_state:
  - lambda: |-
      if (id(first_boot)) {
        return;
      }

      // ==============================================================
      // CORRUPTION / ANOMALY CATCHER
      // ==============================================================
      // Flash memory read failures often return 0.0°C (32°F) or NaN.
      // If the target drops below 12.0°C (54°F), it's a system glitch.
      if (x.target_temperature_high < 12.0 || x.target_temperature_low < 12.0) {
        ESP_LOGW("custom", "Anomalous setpoint detected (memory glitch). Forcing AWAY mode.");
        id(climate_entity).preset = climate::CLIMATE_PRESET_AWAY;
        id(climate_entity).target_temperature_low = 16.0;  // 16°C = 60°F
        id(climate_entity).target_temperature_high = 26.0; // 26°C = 78°F
        id(climate_entity).publish_state();
        return;
      }

      // ==============================================================
      // HARD CLAMPING LOGIC (ESPHome Native Core is ALWAYS Celsius!)
      // 68°F = 20.0°C  |  72°F = 22.222°C
      // ==============================================================
      float max_heat = id(use_fahrenheit) ? 22.222 : 22.0; 
      float min_cool = id(use_fahrenheit) ? 20.000 : 20.0; 
      bool clamped = false;

      // Clamp Heating Setpoint (72°F Max)
      if (x.target_temperature_low > max_heat) {
        ESP_LOGI("custom", "Heat setpoint clamped back down to 72°F");
        id(climate_entity).target_temperature_low = max_heat;
        clamped = true;
      }

      // Clamp Cooling Setpoint (68°F Min)
      if (x.target_temperature_high < min_cool) {
        ESP_LOGI("custom", "Cool setpoint clamped back up to 68°F");
        id(climate_entity).target_temperature_high = min_cool;
        clamped = true;
      }

      if (clamped) {
        id(climate_entity).publish_state();
        return; 
      }
      // ==============================================================


      // Check if a preset is currently active
      if (x.preset.has_value() && x.preset.value() != climate::CLIMATE_PRESET_NONE) {
        float current_low = x.target_temperature_low;
        float current_high = x.target_temperature_high;

        // Apply your Fahrenheit conversion
        if (id(use_fahrenheit)) {
          current_low = current_low * (9.0/5.0) + 32.0;
          current_high = current_high * (9.0/5.0) + 32.0;
        }

        int check_low = round(current_low);
        int check_high = round(current_high);
        int expected_low = check_low;
        int expected_high = check_high;

        // Map the expected bounds based on the active preset
        switch (x.preset.value()) {
          case climate::CLIMATE_PRESET_HOME:
            expected_low = id(use_fahrenheit) ? 66 : 19;
            expected_high = id(use_fahrenheit) ? 75 : 24;
            break;
          case climate::CLIMATE_PRESET_AWAY:
            expected_low = id(use_fahrenheit) ? 60 : 16;
            expected_high = id(use_fahrenheit) ? 78 : 26;
            break;
          case climate::CLIMATE_PRESET_SLEEP:
            expected_low = id(use_fahrenheit) ? 62 : 17;
            expected_high = id(use_fahrenheit) ? 80 : 27;
            break;
          default:
            break;
        }

        // If manual change detected, bypass make_call() and update state directly
        if (check_low != expected_low || check_high != expected_high) {
          ESP_LOGI("custom", "Manual temperature change detected. Forcing preset to NONE.");
          id(climate_entity).preset = climate::CLIMATE_PRESET_NONE;
          id(climate_entity).publish_state();
          return; 
        }
      }
  - lambda: |-
      if (id(first_boot)) {
        return;
      }
      float low_temp = x.target_temperature_low;

      if (id(use_fahrenheit)) {
        low_temp = low_temp * (9.0/5.0) + 32.0;
      }
      if (id(op_bytes) == 0x84 && id(set_temp) != low_temp) {
        ESP_LOGI("custom","Got new set point for heat-- old: %i, new: %f",id(set_temp), low_temp);
        id(set_temp) = low_temp;
        id(new_input) = true;
      }

      float high_temp = x.target_temperature_high;

      if (id(use_fahrenheit)) {
        high_temp = high_temp * (9.0/5.0) + 32.0;
      }
      if (id(op_bytes) == 0x88 && id(set_temp) != high_temp) {
        ESP_LOGI("custom","Got new set point for cool-- old: %i, new: %f",id(set_temp), high_temp);
        id(set_temp) = high_temp;
        id(new_input) = true;
      }
  - lambda: |-
        if (id(first_boot)) {
          return;
        }
        if (x.fan_mode == climate::CLIMATE_FAN_HIGH && id(fan_bytes) != 0x01) {
          ESP_LOGI("custom","Changing fan mode to high");
          id(fan_bytes) = 0x01;
          id(new_input) = true;
        }
        if (x.fan_mode == climate::CLIMATE_FAN_AUTO && id(fan_bytes) < 0x80) {
          ESP_LOGI("custom","Changing fan mode to auto");
          id(fan_bytes) = 0x80;
          id(new_input) = true;
        }
        if (x.fan_mode == climate::CLIMATE_FAN_MEDIUM && id(fan_bytes) != 0x02) {
          ESP_LOGI("custom","Changing fan mode to medium");
          id(fan_bytes) = 0x02;
          id(new_input) = true;
        }
        if (x.fan_mode == climate::CLIMATE_FAN_LOW && id(fan_bytes) != 0x04) {
          ESP_LOGI("custom","Changing fan mode to low");
          id(fan_bytes) = 0x04;
          id(new_input) = true;
        }
  - if:
      condition:
        lambda: 'return x.mode == climate::CLIMATE_MODE_OFF;'
      then:
        - lambda: |-
            if (id(first_boot)) {
              return;
            }
            ESP_LOGI("custom","Changing mode to off");
            id(op_bytes) = 0x00;
            id(new_input) = true;
